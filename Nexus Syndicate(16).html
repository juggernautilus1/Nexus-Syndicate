<h1>NEXUS<small>SYNDICATE</small></h1>
<div id="ctl"></div><div id="wrap"><div id="main"><div id="top"></div><div id="board"></div><div id="bot"></div></div><div id="info"></div><div id="rside"><div id="hand"></div><div id="hist"></div></div></div><div id="msg"></div><div id="tray"></div><div id="btns"></div>
<div id="menu"><h1>NEXUS<small>SYNDICATE</small></h1><label><input type="checkbox" id="omob" checked> Mobilisation (optional rule)</label><label><input type="checkbox" id="oig" checked> Intrigue (optional rule)</label><button class="btn pri" data-k="go" data-m="ai">Play the computer</button><button class="btn" data-k="go" data-m="hot">Two players, one screen</button><div>Online: both enter the same room code; Player 1 starts first<br><input type="text" id="code" placeholder="room code" maxlength="12"></div><div><button class="btn" data-k="go" data-m="n0">I am Player 1</button> <button class="btn" data-k="go" data-m="n1">I am Player 2</button></div></div>
<script>
const C=['b','r','g'],NM={b:'blue',r:'red',g:'green'},$=id=>document.getElementById(id);
const adj=i=>{const x=i%3,y=i/3|0,a=[];x>0&&a.push(i-1);x<2&&a.push(i+1);y>0&&a.push(i-3);y<2&&a.push(i+3);return a};
const E=()=>({b:{S:0,M:0},r:{S:0,M:0},g:{S:0,M:0}});
const tot=t=>C.reduce((s,c)=>s+t.p[c].S+t.p[c].M,0),hasM=t=>t.m[0]+t.m[1]>0,hasB=t=>t.p.b.S+t.p.b.M>0;
const pyr=(c,s,n,all)=>{if(!ST||all)return `<span class="pyr ${c} ${s} num"><i></i>${all?`<u>${n}</u>`:n>1?`<u>×${n}</u>`:''}</span>`;const m=Math.min(Math.max(n,1),6);return `<span class="pyr ${c} ${s}" style="--n:${m}">${n<1?'<i class="gh"></i>':'<i></i>'.repeat(m)}</span>`};
let S,mv,a;
function init(){FR=[];LJ='';
 const cards=[];C.forEach(c=>['S','M'].forEach(s=>[1,2,3].forEach(n=>cards.push({c,s,n}))));cards.push(null,null);
 for(let i=cards.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[cards[i],cards[j]]=[cards[j],cards[i]]}
 S={t:[],pool:E(),pop:[{b:0,r:0,g:0},{b:0,r:0,g:0}],sup:6,dice:{b:3,r:3,g:3},vp:[0,0],cur:0,ph:'pm',pro:0,first:-1,opt:{mob:1,ig:1},ig:[0,0],ai:-1,fin:false,igs:null,log:[]};mv=a=null;
 for(let i=0;i<9;i++){const t={p:E(),m:[0,0],d:{b:0,r:0,g:0}};[cards[2*i],cards[2*i+1]].forEach(k=>k&&(t.p[k.c][k.s]+=k.n));S.t.push(t)}
 [cards[18],cards[19]].forEach(k=>k&&(S.pool[k.c][k.s]+=k.n));render()}
const targets=()=>{const cur=mv.path[mv.path.length-1],r=mv.hand.length;let T;
 if(mv.loop)T=[mv.loop.cyc[mv.loop.i%mv.loop.cyc.length]];
 else T=adj(cur).filter(x=>{const i=mv.path.indexOf(x);return i<0||(i===0&&mv.path.length>=4)});
 if(r===1&&mv.sel)T=T.filter(x=>S.t[x].p[mv.sel.c][mv.sel.s]>0||S.t[x].d[mv.sel.c]>0);return T};
function avail(){const o=1-S.cur,pl=[];C.forEach(c=>['S','M'].forEach(s=>S.pool[c][s]&&pl.push({c,s,n:S.pool[c][s],src:'pool'})));
 if(pl.length)return pl;
 for(const p of [o,S.cur]){const l=C.filter(c=>S.pop[p][c]).map(c=>({c,s:'S',n:S.pop[p][c],src:p}));if(l.length)return l}return[]}
const stOpts=()=>a.left>0&&adj(a.x).some(i=>hasM(S.t[i])&&C.some(c=>S.t[i].d[c]?S.t[i].d[c]<6:S.dice[c]>0));
function hlSet(){const s=new Set(),add=l=>l.forEach(x=>s.add(x)),all=[0,1,2,3,4,5,6,7,8],A=a?adj(a.x):[];
 switch(S.ph){
 case'pm':add(all.filter(i=>!(S.pro===1&&S.first===i)));break;
 case'pick':add(all.filter(i=>tot(S.t[i])));break;
 case'move':add(targets());break;
 case'sw1':case'st1':add(A);break;
 case'seed':add(a.any?all:A);break;
 case'ig1':add(all.filter(i=>hasM(S.t[i])));break;
 case'ig2':add(all.filter(i=>hasM(S.t[i])&&i!==S.igs.i));break;
 case'sw2':add(all.filter(i=>i!==a.u&&hasB(S.t[i])));break;
 case'sil':add(A.filter(i=>tot(S.t[i])));break;
 case'sil2':add(A.filter(i=>C.some(c=>S.t[i].d[c])));break;
 case'st2':add(A.filter(i=>hasM(S.t[i])));break}
 return s}
function render(){
 if(!RP){const id=['pm','pd','pick','move','confirm','ig1','ig2'].includes(S.ph)?S.log.length:S.log.length-1,js=JSON.stringify({S:{...S,log:0},mv,a});if(js!==LJ){LJ=js;FR.push({id,js})}clearTimeout(sv);sv=setTimeout(save,300)}
 if(mv&&!mv.hand.some(h=>mv.sel&&h.c===mv.sel.c&&h.s===mv.sel.s))mv.sel=mv.hand[0]?{c:mv.hand[0].c,s:mv.hand[0].s}:null;
 if(S.ph==='seed'){const av=avail();if(av.length&&!av.some(x=>a.sel&&x.c===a.sel.c&&x.s===a.sel.s))a.sel={c:av[0].c,s:av[0].s}}

 if(S.ph==='sil2'&&ok){t.d[c]--;a.left--;lg(` -1 ${NM[c]} die at ${nm(i)}.`);if(!t.d[c]){S.dice[c]++;if(!C.some(k=>t.d[k])){S.sup+=t.m[0]+t.m[1];t.m=[0,0]}}
  if(a.left<=0||!adj(a.x).some(j=>C.some(k=>S.t[j].d[k])))return endTurn();render()}
 else if(S.ph==='st2'&&ok&&hasM(t)&&a.left>0){if(t.d[c]){if(t.d[c]>=6)return;t.d[c]++}else{if(!S.dice[c])return;S.dice[c]--;t.d[c]=1}
  a.left--;lg(` +1 ${NM[c]} die at ${nm(i)}.`);if(!stOpts())return endTurn();render()}
 else onTile(i)}
function setDie(c){const t=S.t[S.ph==='pd'?S.pi:a.si];S.dice[c]--;t.d[c]=1;if(S.ph==='pd')S.log.push({p:S.cur,k:'p',t:`Prologue: marker and ${NM[c]} die at ${nm(S.pi)}.`});else lg(` Die: ${NM[c]}.`);
 if(S.ph==='pd'){if(S.pro===0){S.first=S.pi;S.pro=1;S.cur=1;S.ph='pm'}else{S.cur=0;S.ph='pick'}}
 else{a.left--;S.ph='st2';auto()}
 render()}
function act(k){
 if(k==='undo'){undo()}
 else if(k==='cancel'){while(mv.placed.length)undo();mv.hand.forEach(h=>S.t[mv.o].p[h.c][h.s]++);mv=null;S.ph='pick'}
 else if(k==='ok'){commit();return render()}
 else if(k==='done')return endTurn();
 else if(k==='new')return $('menu').hidden=false;
 else if(k==='basic'||k==='adv'){UH.push(JSON.stringify({S,a}));begin(k==='adv'?1:0);return render()}
 else if(k==='uundo'){const p=JSON.parse(UH.pop());S=p.S;a=p.a;{const js=JSON.stringify({S:{...S,log:0},mv,a}),ix=FR.map(f=>f.js).lastIndexOf(js);if(ix>=0)FR.length=ix+1;LJ=js}}
 else if(k==='flip')FL^=1;
 else if(k==='ig'){S.igEnd=S.ph==='ig0'?1:0;S.ph='ig1'}
 else if(k==='igx'){if(S.igEnd){S.igEnd=0;S.ph='ig0'}else S.ph='pick'}
 else if(k==='fin')return endTurn2();
 render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-k]');if(!el)return;const d=el.dataset,i=+d.i;
 if(d.k==='go')return start(d.m);if(d.k==='x'&&d.a==='rpx')return stopRp();if(d.k==='x'&&d.a==='newg'){if(confirm('Start a new game? The current game will be lost.')){try{localStorage.removeItem('nxs')}catch(e){}$('menu').hidden=false}return}if(d.k==='x'&&(d.a==='stk'||d.a==='flip')){if(d.a==='stk')ST^=1;else FL^=1;return render()}if(d.k==='h')return RP?0:replay(+d.i);if(RP)return;if(S.ph==='over'&&d.k!=='x')return;if(NET&&S.cur!==ME&&S.ph!=='over')return;Tx=1;setTimeout(()=>{Tx=0});const tr=ACT.includes(S.ph)&&d.k!=='chip'&&d.k!=='x',pre=tr?JSON.stringify({S,a}):0;
 if(d.k==='t')onTile(i);else if(d.k==='p')onPyr(i,d.c,d.s);else if(d.k==='d')onDie(i,d.c);
 else if(d.k==='chip'){if(S.ph==='move')mv.sel={c:d.c,s:d.s};else a.sel={c:d.c,s:d.s};render()}
 else if(d.k==='dc')setDie(d.c);else if(d.k==='x')act(d.a);
 else if(d.k==='m'){if(S.ph==='ig1'){S.igs={i,p:+d.p};S.ph='ig2';render()}else onTile(i)}
 if(tr){if(ACT.includes(S.ph)){if(JSON.stringify({S,a})!==pre)UH.push(pre)}else UH=[];ui()}});
boot();
</script></body></html>
